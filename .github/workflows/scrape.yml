# .github/workflows/scrape.yml
name: Update Stock Data

on:
  schedule:
    - cron: '0 2 * * *'  # هر روز ساعت ۲ بامداد UTC
  workflow_dispatch:      # امکان اجرای دستی از تب Actions

permissions:
  contents: write         # اجازه کامیت کردن فایل داده

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv venv
          source .venv/bin/activate
          uv pip install pandas requests pyarrow
      - name: Run scraper
        run: |
          source .venv/bin/activate
          python scraper.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.parquet
          git diff --staged --quiet || git commit -m "data: update stock data"
          git push
